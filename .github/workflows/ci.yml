name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (async)
        run: cargo clippy --features defmt -- -D warnings

      - name: Clippy (blocking)
        run: cargo clippy --no-default-features --features blocking,defmt -- -D warnings

      - name: Tests (async)
        run: cargo test

      - name: Tests (blocking)
        run: cargo test --no-default-features --features blocking

      - name: Examples check (async)
        run: cargo check --examples

      - name: Examples check (blocking)
        run: cargo check --no-default-features --examples --features blocking

      - name: Package verification
        run: cargo package

      - name: STM32 example binaries
        working-directory: embassy-stm32g030f6-examples
        run: cargo check --bins --target thumbv6m-none-eabi

      - name: STM32 format check
        working-directory: embassy-stm32g030f6-examples
        run: cargo fmt --check

      - name: STM32 clippy
        working-directory: embassy-stm32g030f6-examples
        run: cargo clippy --bins --target thumbv6m-none-eabi -- -D warnings

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage (async)
        run: cargo llvm-cov --no-report

      - name: Coverage (blocking)
        run: cargo llvm-cov --no-report --no-default-features --features blocking

      - name: Generate coverage report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
